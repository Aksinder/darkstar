# ============================================================
# Inverter Profile: Sungrow
# Schema Version: 2
# ============================================================

metadata:
  name: "sungrow"
  version: "2.0.0"
  schema_version: 2
  description: "Sungrow hybrid inverters using Watts-based control with composite modes"
  supported_brands:
    - "Sungrow"

entities:
  work_mode:
    default_entity: "select.ems_mode"
    domain: "select"
    category: "system"
    description: "EMS Mode selector (primary operating mode)"
    required: true

  forced_charge_discharge_cmd:
    default_entity: "select.battery_forced_charge_discharge"
    domain: "select"
    category: "system"
    description: "Forced charge/discharge command selector"
    required: true

  max_charge_power:
    default_entity: "number.battery_max_charge_power"
    domain: "number"
    category: "battery"
    description: "Maximum battery charging power (Watts)"
    required: true

  max_discharge_power:
    default_entity: "number.battery_max_discharge_power"
    domain: "number"
    category: "battery"
    description: "Maximum battery discharge power (Watts)"
    required: true

  export_power_limit:
    default_entity: "number.export_power_limit"
    domain: "number"
    category: "battery"
    description: "Grid export power limit (Watts)"
    required: false

  export_power_limit_switch:
    default_entity: "switch.export_power_limit"
    domain: "switch"
    category: "battery"
    description: "Grid export power limit switch"
    required: false

  forced_charge_discharge_power:
    default_entity: "number.battery_forced_charge_discharge_power"
    domain: "number"
    category: "battery"
    description: "Forced mode charge/discharge power cap (Watts)"
    required: true

  # Read-only: the inverter's own system state (mkaiser template over register
  # 13000). The executor reads it before every mode and applies nothing while it
  # is in one of behavior.fault_states — see the fault gate note below.
  inverter_state:
    default_entity: "sensor.sungrow_inverter_state"
    domain: "sensor"
    category: "system"
    description: "Inverter system state (Running / Fault / Standby ...)"
    required: false

modes:
  charge:
    description: "Grid charge — Force charge battery from AC grid"
    actions:
      - entity: "work_mode"
        value: "Forced mode"
      - entity: "forced_charge_discharge_cmd"
        value: "Forced charge"
      - entity: "forced_charge_discharge_power"
        value: "{{charge_value}}"
      - entity: "max_charge_power"
        value: "{{charge_value}}"
      - entity: "max_discharge_power"
        value: "{{max_discharge}}"

  export:
    description: "Grid export — Force discharge battery to grid"
    actions:
      - entity: "work_mode"
        value: "Forced mode"
      - entity: "forced_charge_discharge_cmd"
        value: "Forced discharge"
      # The PLANNED discharge rate, not max_discharge. With max here, any slot that
      # earned export mode dumped the pack at 9.5 kW to the SoC floor no matter how
      # little battery->grid the plan actually priced (2026-09-12, seven bursts in a
      # morning). max_discharge_power below stays at max so house load is covered.
      - entity: "forced_charge_discharge_power"
        value: "{{export_discharge_w}}"
      - entity: "max_discharge_power"
        value: "{{discharge_value}}"
      # Deliberate grid export wants NO feed-in limit: mode switch OFF (unlimited).
      # The old actions wrote a high W value to the limit register + switch ON —
      # the SH10RT rejects out-of-range register writes (pymodbus isError on
      # 10000 W, 2026-08-03), which silently left the previous low limit active
      # and would have throttled the export this mode exists to perform.
      - entity: "export_power_limit_switch"
        value: "off"

  self_consumption:
    description: "Self consumption — Normal PV to battery and house"
    actions:
      - entity: "work_mode"
        value: "Self-consumption mode (default)"
      - entity: "forced_charge_discharge_cmd"
        value: "Stop (default)"
      - entity: "forced_charge_discharge_power"
        value: 0
      - entity: "max_discharge_power"
        value: "{{max_discharge}}"
      - entity: "max_charge_power"
        value: "{{max_charge}}"

  idle:
    description: "Idle / Hold — Block discharge, preserve battery, Allow PV charge"
    actions:
      - entity: "work_mode"
        value: "Self-consumption mode (default)"
      - entity: "forced_charge_discharge_cmd"
        value: "Stop (default)"
      - entity: "forced_charge_discharge_power"
        value: 0
      - entity: "max_discharge_power"
        value: 10
      - entity: "max_charge_power"
        value: "{{max_charge}}"

behavior:
  control_unit: "W"
  min_charge_w: 10.0
  round_step_w: 100.0
  write_threshold_w: 100.0
  mode_settling_ms: 100
  # inverter_state values that mean "not operating". Exact strings as the
  # sungrow_inverter_state template renders them; case-insensitive.
  fault_states:
    - "Fault"

# ============================================================
# IMPORTANT NOTES (from mkaiser/Sungrow-SHx-Inverter-Modbus-Home-Assistant)
# ============================================================
#
# 1. COMPOSITE MODE ARCHITECTURE:
#    Sungrow uses two selectors together:
#    - work_mode (EMS Mode): "Self-consumption mode (default)" or "Forced mode"
#    - forced_charge_discharge_cmd: "Stop (default)", "Forced charge", or "Forced discharge"
#
# 2. POWER VALUES:
#    - Minimum power value is 10W (inverter enforces this as lowest valid setting)
#    - Forced Power must be set in multiples of 10W
#    - In forced modes, always set the corresponding max_*_power to ensure
#      it doesn't cap the forced power
#
# 3. IDLE MODE BEHAVIOR:
#    Idle mode uses max_discharge_power=10W (minimum) instead of 0W to
#    prevent battery discharge while still allowing PV charging.
#
# 4. SELF-CONSUMPTION MODE:
#    In "Self-consumption mode (default)", the forced_charge_discharge_cmd
#    is completely ignored regardless of its current value. The battery
#    charges from excess PV and discharges to meet home load demand.
#
# 5. FAULT GATE (2026-09-24):
#    A faulted SH10RT still answers every Modbus read and accepts every write —
#    it just does nothing with them. For a week (2026-09-16 17:31 -> 09-23 20:31)
#    the executor logged "5/5 actions successful" per tick against an inverter
#    whose system state said Fault: no charge, no discharge, no PV from its own
#    strings. The unreachable guard cannot see this (the entities are available),
#    so the executor reads inverter_state first and refuses to apply ANY mode
#    while it is in fault_states — one notification on entry, one on recovery.
#    An unreadable state sensor leaves the gate open (that is the link being
#    down, which the per-entity guard already handles).
#
# 6. MAX DISCHARGE POWER CAP:
#    max_charge_power and max_discharge_power act as caps on battery power
#    in BOTH Self-consumption and Forced modes. Set these high (user config max)
#    when you want full power availability.
#
# 6. EXPORT LIMIT:
#    Export limit works independently of EMS mode - it is active in all
#    modes when the switch is on. Export is controlled via export_power_limit
#    entity, NOT via max_discharge_power.
#
# 7. FORCED MODE BEHAVIOR:
#    In "Forced mode", the battery responds to forced_charge_discharge_cmd
#    and forced_charge_discharge_power settings. This is used for grid
#    charge and grid export actions.
