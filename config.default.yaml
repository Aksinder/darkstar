# =============================================================================
# Darkstar Configuration
# =============================================================================
# This is the user's production configuration file.
# Structure matches config.default.yaml with user-specific values.
# =============================================================================

# System Metadata
config_version: 2                     # Config format version (for migration tracking)
timezone: "Europe/Stockholm"          # IANA timezone for all schedule calculations

# System Parameters
system:
  system_id: prod
  inverter_profile: null           # Profile: generic | deye | fronius | victron

  # System Profile Toggles (what hardware do you have?)
  has_solar: true         # Enable PV forecasting & solar-related features
  has_battery: true       # Enable battery control & grid arbitrage
  has_water_heater: true  # Enable water heating optimization
  has_ev_charger: false   # Enable EV charging optimization
  grid_meter_type: net    # Meter type: net (single +/- sensor) | dual (separate import/export)

  grid:
    max_power_kw: 8                    # HARD limit: max grid import (cannot be exceeded)
  inverter:
    max_ac_power_kw: 10.0              # Maximum inverter AC power output (PV + battery discharge).
                                       # This caps battery DISCHARGE against the hybrid (battery)
                                       # inverter's AC bus minus its OWN PV. On a multi-inverter
                                       # site, tag which arrays are on this inverter via
                                       # solar_arrays[].on_battery_inverter so PV on a separate
                                       # AC-coupled inverter (e.g. Fronius) isn't wrongly counted.
    max_dc_input_kw: 12.0              # Maximum DC power from PV strings (clips PV forecast)
  location:
    latitude: 55.123                # Decimal degrees, positive north (for PV forecasting)
    longitude: 13.123               # Decimal degrees, positive east (for PV forecasting)
  solar_arrays:
    - name: "Main Array"
      azimuth: 180                       # Panel direction: 0°=North, 90°=East, 180°=South, 270°=West
      kwp: 5.0                           # Total DC peak power of PV array in kilowatts
      tilt: 35                           # Panel angle from horizontal: 0°=flat, 90°=vertical
      # on_battery_inverter: true        # Multi-inverter only: set on the arrays wired to the
      #                                  # HYBRID/battery inverter. The max_ac_power_kw discharge
      #                                  # headroom then reserves room for only this inverter's PV
      #                                  # share (sum of tagged kWp / total kWp). Omit on a
      #                                  # single-inverter system (all PV counts, legacy behaviour).

# Battery Specifications
battery:
  capacity_kwh: 34.2
  nominal_voltage_v: 48.0             # Nominal battery voltage (used for Planning)
  min_voltage_v: 46.0                 # Minimum safe voltage (used for Executor safety)
  max_charge_a: 185.0                 # Max charging current (A)
  max_discharge_a: 185.0              # Max discharging current (A)
  max_charge_w: 5000.0                # Max charging power (W)
  max_discharge_w: 5000.0             # Max discharging power (W)
  min_soc_percent: 12
  max_soc_percent: 100                # Soft penalty ceiling — planner prefers to stay below, but overshoots are allowed with a discharge action rather than failure. BMS enforces the absolute limit.
  # NOTE: Used only in planner/simulation.py. Separate from charge_efficiency
  # which is used by the MILP solver. Derives one-way efficiency as sqrt(roundtrip).
  roundtrip_efficiency_percent: 95.0
  charge_efficiency: 0.92             # Charging efficiency (0-1)

battery_economics:
  battery_cycle_cost_kwh: 0.2      # Degradation cost applied per kWh cycled through the battery


# Water Heating (Global Settings)
# Per-device settings (power, min_kwh_per_day, spacing) are now in water_heaters[] array below
water_heating:
  defer_up_to_hours: 6             # Allow deferring "today's" heating into early tomorrow morning (up to N hours) if cheaper
  comfort_level: 3                 # 1-5 (Economy→Maximum) — drives ALL water penalties via the
                                   # solver's COMFORT_MAP (reliability / block-start / block).
                                   # (The old block_start_penalty_sek / spacing_penalty_sek keys
                                   # here were read by no code and have been removed.)
  enable_top_ups: true             # Enable spaced top-up heating blocks (vs bulk heating only)
  hourly_blocks: true              # PERF: water on/off decided per wall-clock hour instead of per
                                   # 15-min slot (executor still gets 15-min slots — they're just
                                   # equal within the hour). Kills the solver's temporal symmetry:
                                   # measured 8x faster solves for ~0.1% objective cost. Only
                                   # disable to A/B the solver.


  # Vacation Mode (anti-legionella)
  vacation_mode:
    enabled: false                    # Master switch (HA entity can override when ON)
    anti_legionella_temp_c: 65        # Target temperature for safety cycle
    anti_legionella_interval_days: 7  # Run cycle every N days
    anti_legionella_duration_hours: 3.0  # Duration at power_kw (e.g., 3h * 3kW = 9kWh)
    end_date: ""                      # Vacation mode end date (set by UI/Automation)

  # NOTE (2026-07-04 audit): the water-heating penalties are driven ENTIRELY by
  # comfort_level above, via the solver's COMFORT_MAP (adapter.py). At level 3 the
  # live values are: reliability 15 SEK/kWh, block-start 3.0 SEK, block 2.0 SEK.
  # The old reliability_penalty_sek / block_penalty_sek keys documented here were
  # read by NO code (removed — they only misled tuning). To make heating more/less
  # guaranteed or more/less consolidated: change comfort_level.

# =============================================================================
# Entity-Centric Device Configuration (ARC15)
# =============================================================================
# These sections replace the old `deferrable_loads` array with proper entity
# definitions. Each device type has its own array supporting multiple instances.

# Water Heaters (Array for multiple water heaters)
# ARC15: Replaces deferrable_loads entry for water heating
water_heaters:
  - id: main_tank                    # Unique identifier (slug format)
    name: "Main Water Heater"        # Display name in UI
    enabled: true                    # Master toggle for this heater
    power_kw: 3.0                    # Rated power consumption (kW)
    min_kwh_per_day: 6.0             # Minimum daily energy requirement (kWh)
    max_hours_between_heating: 8     # Max comfort gap between heating cycles
    water_min_spacing_hours: 4       # Minimum gap between heating starts
    sensor: ''                       # Home Assistant entity for power reading
    target_entity: ''                # Control entity. A number/input_number gets the target
                                     # TEMPERATURE written (thermostat/bridge setups). A
                                     # switch/input_boolean is driven DIRECTLY by the executor
                                     # (command > 50°C = on, temp_off = off) — no HA bridge
                                     # automation needed, and drift (device reboot, manual
                                     # toggle) self-heals on the next executor run.
    type: binary                     # Load type: binary (on/off) or modulating
    exclude_from_vacation: false     # When vacation is active, this tank still gets NORMAL comfort
                                     # heating instead of being shut off (e.g. a rented-out Villavagn
                                     # tank while the owners are away). Default false = follows vacation.

  # Example: Second water heater (disabled by default)
  # - id: upstairs_tank
  #   name: "Upstairs Water Heater"
  #   enabled: false
  #   power_kw: 3.0
  #   min_kwh_per_day: 4.0
  #   max_hours_between_heating: 12
  #   water_min_spacing_hours: 4
  #   sensor: sensor.wh2_power
  #   target_entity: ''
  #   type: binary

  # Example: Thermal tank — models the tank as a thermal battery from the heating-power
  # meter (no temp/flow sensor needed) and publishes, using ONE canonical naming scheme:
  #   sensor.<sensor_prefix><id>_hot_water_level   (%)
  #   sensor.<sensor_prefix><id>_liters_remaining  (L)
  #   sensor.<sensor_prefix><id>_estimated_temperature (°C)
  #   sensor.<sensor_prefix><id>_draw_today        (kWh)
  # The suffixes match HA-native template sensors so there is a single convention.
  #
  # IMPORTANT — do NOT run this for a tank that already has HA template sensors of the
  # same id (e.g. sensor.house_vvb_hot_water_level): a template sensor owns its
  # entity_id and a REST push would conflict. sensor_prefix defaults to "darkstar_" so
  # this publisher never collides; set sensor_prefix: "" only when Darkstar should OWN
  # the tank's sensors and no template sensor of that id exists.
  # The estimator dead-reckons litres of hot water like the EV SoC estimator: integrate
  # heating energy UP, deplete by standing loss + a LEARNED hot-water draw rate DOWN, and
  # self-calibrate that draw from each full->full reheat (energy_in - losses = what was tapped).
  # State persists across restarts (data/hot_water_state.json) so it no longer reseeds to FULL.
  # - id: house_vvb
  #   name: "VVB Huset"
  #   enabled: true
  #   type: thermal                  # enables the hot-water estimator + publishing
  #   power_sensor: sensor.house_vvb_real_power   # heating-element power (W); `sensor:` also works
  #   power_scale: 1.0               # 2.0 if only one of two phases is metered
  #   volume_litres: 200             # tank volume
  #   t_cold_c: 10                   # cold-inlet reference
  #   t_max_c: 75                    # max tank temperature (setpoint when fully heated)
  #   ua_w_per_k: 2.5                # standing-loss coefficient (W per K above ambient); tune to taste
  #   prior_draw_kw: 0.15            # avg draw seed (~3.6 kWh/day) until self-calibrated; lower for a small cabin tank
  #   sensor_prefix: "darkstar_"     # "" to own the bare canonical ids (no template conflict)

# Unknown-load observability (default OFF). Publishes the ALREADY-computed residual
# (total load − metered controllable loads) as sensor.darkstar_unknown_load, with total /
# metered / drift_rate attributes. This is NOT appliance disaggregation (infeasible on one
# 3-phase main meter without per-circuit CTs) — it just makes the unmetered "unknown" bucket
# visible/trended, as a guide for which load is worth metering next. Reads input_sensors.load_power
# as total and reuses the load registry (water_heaters[]/ev_chargers[]) as the metered controllable.
unknown_load:
  enabled: false

# EV Chargers (Array for multiple electric vehicles)
# ARC15: Replaces deferrable_loads entry for EV charging
# Note: penalty_levels are configured per-EV in the UI (Settings > Parameters)
# They define willingness to pay for charging at different battery levels
ev_chargers:
  - id: ev_charger_1                 # Unique identifier (slug format)
    name: "EV-01"                    # Display name in UI
    enabled: false                   # Master toggle for this EV (set true to enable)
    max_power_kw: 11.0               # Maximum charging power (kW)
    battery_capacity_kwh: 82.0       # Battery capacity for SoC calculations (kWh)
    sensor: ""                       # Home Assistant entity for power reading
    soc_sensor: ""                   # EV battery state of charge (%) - Required for smart charging
    plug_sensor: ""                  # EV plug status sensor - Required for smart charging
    type: binary                     # Load type: binary (ON/OFF) only. Variable power control not yet implemented
    nominal_power_kw: 11.0           # Nominal power for load calculations
    departure_time: ""               # Daily departure time "HH:MM" (24-hour). Car must be ready by this time.
    switch_entity: ""                # HA entity to enable/disable smart charging (e.g. switch.ev_charger)
    replan_on_plugin: true           # Re-run planner immediately when this EV plugs in
    replan_on_unplug: false          # Re-run planner immediately when this EV unplugs
    # Load-priority integration: assign this charger to a load_priority tier (see
    # load_priority below) and its per-kWh charging willingness-to-pay is sourced from
    # that tier instead of the raw penalty_levels values — unifying EV priority with the
    # deferrable/water loads. The SoC thresholds (how much to charge) still come from
    # penalty_levels. Requires load_priority.enabled: true; empty => legacy penalty_sek.
    wtp_tier: ""                     # e.g. "important" or "comfort"
    # Home-zone gate (presence). For cars whose API reports plug/charging regardless of
    # location (e.g. Tesla), set home_entity to the car's device_tracker/zone so the EV
    # is only scheduled while actually home — otherwise charging elsewhere (work,
    # Supercharger) leaks in as a phantom load. Omit to disable the gate.
    home_entity: ""                  # e.g. device_tracker.white_betty_location
    home_states: ["home"]            # zone/state(s) that count as "home"
    # Robustness so a car that IS home isn't wrongly excluded by a tight zone / GPS drift:
    home_radius_km: 0.0              # >0: also count as home within N km of system.location
    #                               #   (uses the tracker's latitude/longitude attrs)
    home_grace_minutes: 0.0         # >0: keep "home" for N min after the tracker flips away
    #                               #   (debounces momentary GPS drift)
    # Come-home prediction (Step 1): pre-position a SOFT, capped battery buffer when the
    # car is likely to come home, so its charging can lean on cheap/solar energy. Three
    # distance zones: near (<=near_radius_km) => certain arrival (p=1, full reserve);
    # extended (<=extended_radius_km) => probability from the learned arrival profile
    # (weekday x hour, built from device_tracker history); beyond => no reserve. The
    # reserve only lifts a SOFT target-SoC floor (economics still override). Default off.
    come_home:
      enabled: false
      near_radius_km: 5             # this close => treat as certainly arriving (p=1)
      extended_radius_km: 30        # region where the probability model works (e.g. the island)
      buffer_kwh: 5.0               # battery buffer to reserve at p=1
      max_reserve_kwh: 8.0          # hard cap on the reserved buffer
      override_entity: ""           # input_select (auto/force_reserve/force_off) for dashboard control

  # Example: Second EV (disabled by default)
  # - id: ev_charger_2
  #   name: "Fiat 500e"
  #   enabled: false
  #   max_power_kw: 7.4
  #   battery_capacity_kwh: 42.0
  #   sensor: sensor.fiat_power
  #   type: variable
  #   nominal_power_kw: 7.4
  #   departure_time: ""
  #   switch_entity: ""
  #   replan_on_plugin: true
  #   replan_on_unplug: false

# Deferrable household loads (dishwasher, washing machine, ...).
# Darkstar schedules each queued run into the globally cheapest window (free PV
# surplus -> battery -> cheap grid) within a deadline, instead of price-only HA
# automations. A run is non-interruptible (one contiguous block). Disabled by
# default: with no enabled loads + no pending run, nothing changes.
deferrable_loads: []
  # TURNKEY MINIMUM: give Darkstar a power_sensor + switch_entity and it does the rest —
  # auto-arms when the cycle starts (power rises), schedules the whole run into the
  # cheapest FORECAST window before the deadline (duration-aware, unlike a "is it cheap
  # right now?" trigger), gates the plug (resume-on-power), and detects done.
  # - id: washer
  #   name: "Tvättmaskin"
  #   enabled: true
  #   power_sensor: sensor.tvattmaskin_power    # REQUIRED (turnkey): auto-arm/run/done from draw
  #   switch_entity: switch.tvattmaskin         # REQUIRED to defer: the plug Darkstar gates
  #   # --- Power-based arm/done thresholds (defaults match the proven HA automations) ---
  #   on_threshold_w: 10            # sustained draw >= this => cycle started (arm)
  #   off_threshold_w: 3            # sustained draw < this => cycle done
  #   start_debounce_s: 3           # draw must stay above on_threshold this long to arm
  #   done_delay_s: 300             # draw must stay below off_threshold this long to call it done
  #   override_entity: input_boolean.washing_machine_override  # optional: force run now (skip deferral)
  #   # --- Scheduling deadline ---
  #   deadline_mode: cheapest_within_hours   # or: hard_deadline
  #   window_hours: 14               # for cheapest_within_hours (soft)
  #   # hard_deadline: "07:00"       # for hard_deadline (finish-by clock time)
  #   # --- Optional / learning ---
  #   duration_min: 120              # Seed cycle length (min); overridden by learned stats
  #   energy_kwh: 1.2                # Seed cycle energy (kWh); overridden by learned stats
  #   energy_sensor: sensor.tvattmaskin_energy  # cumulative kWh meter => accurate per-cycle cost + daily draw
  #   power_scale: 1.0               # multiply metered power (e.g. 2 if only one phase is metered)
  #   phase: A                       # optional grid phase (A/B/C); auto-filled from phase_observer
  #   queued_signal: input_boolean.washing_machine_active  # optional: external "armed" signal instead of
  #                                  # power auto-arm (e.g. a program-status integration)
  #   # status_sensor: sensor.washer_status     # optional program-status sensor for richer cycle phases

# Global settings for deferrable loads (penalties used by the MILP).
deferrable_load_settings:
  soft_deadline_penalty_sek: 30.0    # tardiness penalty/slot for "cheapest within X h"
  hard_deadline_penalty_sek: 1000.0  # tardiness penalty/slot for hard "done by HH:MM"
  phase_penalty_sek: 0.0             # >0 to discourage same-phase concurrency (balancing).
                                     # Uses each load's phase: explicit config, else the
                                     # learned phase (Phase 3) when phase_observer is on.

# Load priority / willingness-to-pay (WTP) layer (increment 1, default OFF).
# A unified way to say "this load matters more than that one". Each controllable load
# is assigned a tier (and an optional intra-tier rank); a tier carries a reservation
# price in SEK/kWh: base_wtp is what the load is worth at rest, urgency_wtp is the extra
# it will pay as its deadline/comfort window closes (linear ramp). The planner then runs
# a load only while its WTP for the slot meets the marginal energy price — so a
# low-priority load (e.g. spa) defers or skips during price peaks and soaks cheap/surplus
# energy, while a high-priority load keeps running. When enabled=false (or for any load
# without an entry) the planner behaves exactly as before.
# Wired: DEFERRABLE loads (dishwasher/washing machine) and WATER HEATERS (VVB, spabad).
# For a water heater the WTP credit is satiated at its daily need (min_kwh_per_day) so it
# never over-heats, and its reliability penalty is waived — a low-priority heater (spa)
# then skips a day when energy costs more than its WTP. (EV folds in a later increment.)
# Match a load's key below to its id in deferrable_loads[] or water_heaters[].
load_priority:
  enabled: false
  rank_step_sek_per_kwh: 0.001       # intra-tier tiebreak granularity (lower rank wins)
  tiers:
    important:                       # e.g. air-source heat pumps, VVB hot water
      base_wtp_sek_per_kwh: 3.0      # worth running up to ~3 SEK/kWh even at rest
      urgency_wtp_sek_per_kwh: 5.0   # +up to 5 SEK/kWh as its deadline approaches
    comfort:                         # e.g. spa / spabad — nice-to-have, price-sensitive
      base_wtp_sek_per_kwh: 0.4      # only runs when energy is cheap/surplus
      urgency_wtp_sek_per_kwh: 0.6
  loads: {}
    # spa:                           # key = the deferrable load's id
    #   tier: comfort
    #   rank: 0                       # lower rank = preferred within the tier
    #   # base_wtp_sek_per_kwh: 0.5   # optional per-load overrides of the tier values
    #   # urgency_wtp_sek_per_kwh: 0.7
    #   # wtp_percentile: 50          # DYNAMIC cap: instead of a fixed SEK value, recompute
    #   #                             #   base_wtp each plan as this percentile of the rolling
    #   #                             #   24 h import prices. The load then heats only in the
    #   #                             #   cheapest ~N% of *that day's* hours — so it never
    #   #                             #   starves on a uniformly-expensive day, yet always
    #   #                             #   refuses the day's most expensive hours. Lower =
    #   #                             #   stricter peak-avoidance; higher = more headroom.
    #   #                             #   Recommended for the VVB (e.g. 45-55).

# Phase-aware imbalance cost in the planner (default OFF). The single-net-node solver
# nets a heavy phase's import against the light phases' export to ~zero, hiding the real
# cost (buy high on the heavy phase, sell low on the others). When enabled, the planner
# PRICES that hidden extra and may discharge the battery to cover the heavy phase — but
# only WHEN ECONOMIC (the avoided import beats the spilled export + battery value spent),
# so the battery covers phase load "when necessary", not always. It uses the per-hour
# phase profile learned by phase_observer (fractions_by_hour in phase_model.json) so the
# cost reflects which phase is heavy at each slot's hour. Requires phase_observer to have
# learned a phase split; with none, this is inert.
phase_aware:
  enabled: false
  weight: 1.0                        # scales the imbalance cost (1.0 = full economic value;
                                     #   lower = gentler nudge, higher = cover more aggressively)

# Phase-aware observability (Observe phase of docs/designs/phase-aware-load-modeling.md).
# Read-only: learns each metered device's electrical phase by correlating its power
# changes against the per-phase grid meter (cancelling the balanced inverter so the
# real load phase shows through), reconstructs the per-phase house-load split, and:
#   - publishes sensor.darkstar_phase_a/b/c_load, sensor.darkstar_phase_imbalance,
#     and sensor.darkstar_<device>_phase (state = A/B/C / "3-fas" / "okänd");
#   - writes <config_dir>/phase_model.json so the planner's realism simulation uses
#     the MEASURED fractions instead of a static guess.
# Controls no hardware. Devices listed under deferrable_loads with a power_sensor are
# learned automatically too (no need to repeat them here).
phase_observer:
  enabled: false                                   # set true to start learning + publishing
  phase_a_sensor: sensor.meter_phase_a_active_power
  phase_b_sensor: sensor.meter_phase_b_active_power
  phase_c_sensor: sensor.meter_phase_c_active_power
  # Inverter AC output S (= PV + battery discharge), split balanced across phases to
  # reconstruct per-phase house load. battery discharge must be POSITIVE; set
  # battery_power_scale: -1 if your sensor reports discharge as negative.
  battery_power_sensor: sensor.battery_power
  battery_power_scale: 1.0
  # pv_power_sensor: sensor.total_pv_power          # optional; omit if folded into battery
  # pv_power_scale: 1.0
  # Average prices used to value the rebalancing recommendations (kr/kWh). The hidden
  # per-phase import is bought high and would otherwise be exported low, so the saving
  # uses the (import - export) spread.
  import_price_sek_kwh: 2.0
  export_price_sek_kwh: 0.5
  devices: []
  #   - id: easee
  #     name: "Easee laddare"
  #     power_sensor: sensor.easee_niska_it_power   # proven on live data -> phase A
  #   - id: tvatt
  #     name: "Tvättmaskin"
  #     power_sensor: sensor.tvattstuga_plugg_power # proven on live data -> phase B

# Continuous stored-energy value (Improvement B, Predbat-inspired). When enabled, the
# Kepler objective gets a terminal credit for energy left at the end of the horizon,
# valued at a conservative fraction of the cheapest upcoming import price. This makes
# the planner hold cheaply-charged / surplus-PV energy instead of exporting it low,
# WITHOUT a hard SoC floor forcing grid top-ups (it complements, doesn't replace, the
# safety floor). The value never exceeds the minimum forward import price, so it can
# never make the planner buy grid just to inflate the terminal SoC. Default off.
battery_value:
  enabled: false           # opt-in: value stored energy continuously in the objective
  lookahead_hours: 12      # forward price window for the estimate
  scale: 0.75              # fraction of the forward floor price to credit (lower = more willing to trade)

# S-Index Configuration (Risk & Safety Strategy)
s_index:
  mode: "probabilistic"            # Options: probabilistic | dynamic
  static_factor:                   # Used when mode=static
  base_factor: 1.1                 # Starting point for dynamic calculations
  max_factor: 1.5                  # Upper bound clamp for dynamic mode
  pv_deficit_weight: 0.2           # Weight for PV/load deficit contribution
  temp_weight: 0.3                 # Weight for temperature adjustment
  temp_baseline_c: 15.0            # Baseline temperature (no adjustment)
  temp_cold_c: -10.0               # Temperature where adjustment reaches 100%
  s_index_horizon_days: 4          # Number of days ahead to evaluate (integer)
  risk_appetite: 3                 # 1-5 scale (1=safe, 3=neutral, 5=gambler)
  max_safety_buffer_percent: 20    # Max reserve capacity to hold at 100% deficit (default 40%)

export:
  enable_export: true              # Master switch for grid export (if false, planner enforces 0 export)
  export_floor_soc_percent: 20     # Min SoC % required to allow grid export (planner constraint)

# Manual Planning Defaults
manual_planning:
  charge_target_percent: 95        # Cap for manual charge slots
  export_target_percent: 35        # Floor target when manually scheduling export

# Debug & Telemetry (developer settings)
debug:
  enable_planner_debug: false          # Enable verbose planner logging
  sample_size: 30                      # Sample size for debug output charts

# Automation (Background Scheduler)
automation:
  enable_scheduler: true               # Enable automatic schedule regeneration
  schedule:
    every_minutes: 30                  # How often to regenerate schedule
    jitter_minutes: 0                  # Random delay to avoid thundering herd
  ml_training:
    enabled: true                      # Enable automatic ML model retraining
    run_days: [1, 4]                   # Days of week to train (0=Mon, 6=Sun)
    run_time: "03:00"                  # Time of day to run training (HH:MM)

# Learning Engine (Aurora Reflex)
# Learning Engine Configuration
# The learning system has two main components:
# 1. Telemetry: Records planner decisions, forecasts, and actual outcomes to SQLite
# 2. Reflex: Tunes physical/policy parameters (S-Index, PV confidence, battery cost) based on safety/ROI analysis
learning:
  enable: true                         # Master switch: enables telemetry storage and learning features
  sqlite_path: "data/planner_learning.db"  # Database path for storing planner telemetry (observations, forecasts, plans, metrics)
  horizon_days: 3                      # Number of days of Aurora ML forecasts to generate (2-7 days, affects CPU usage)
  min_improvement_threshold: 0.015     # Minimum improvement (0-1 scale) required before applying learned adjustments (prevents noise)
  reflex_enabled: true                 # Enable Reflex: tunes physical/policy parameters (S-Index, PV confidence, battery cost, capacity) based on safety/confidence/ROI/capacity analysis
  min_sample_threshold: 2              # Minimum data points required before applying learned adjustments (prevents premature tuning with insufficient data)

  # Rate Limits for Aurora Reflex Parameter Tuning
  # These limits prevent instability by capping how much each parameter can change per day
  # Reflex analyzes historical data and gradually adjusts parameters within these bounds
  max_daily_param_change:
    pv_confidence_percent: 1.0         # Max daily change to PV forecast confidence (percentage points per day)
    load_safety_margin_percent: 1.0    # Max daily change to load forecast safety margin (percentage points per day)
    battery_use_margin_sek: 0.02       # Max daily change to battery use margin (SEK per day)
    export_profit_margin_sek: 0.02     # Max daily change to export profit margin (SEK per day)
    s_index_base_factor: 0.05          # Max daily change to S-Index base factor (absolute value per day, prevents aggressive reserve changes)
    s_index_pv_deficit_weight: 0.1     # Max daily change to S-Index PV deficit weight (absolute value per day)
    s_index_temp_weight: 0.1           # Max daily change to S-Index temperature weight (absolute value per day)
    future_price_guard_buffer_sek: 0.05  # Max daily change to future price guard buffer (SEK per day)

# Nordpool API Configuration (electricity prices)
nordpool:
  price_area: "SE4"                    # Nordpool bidding zone (SE1-SE4, NO1-NO5, DK1-DK2, FI, etc.)
  currency: "SEK"                      # Price currency
  resolution_minutes: 15               # Slot resolution (15, 30, or 60)

# Pricing Configuration (your electricity costs)
pricing:
  vat_percent: 25.0                    # VAT percentage on electricity
  grid_transfer_fee_sek: 0.2456        # Grid operator transfer fee per kWh (fallback literal)
  grid_transfer_fee_entity: ""         # Optional HA entity overriding the literal (single source).
                                       # Accepts SEK/kWh or öre/kWh (auto-converts by unit_of_measurement),
                                       # so you can point it straight at your nätavgift input_number.
  energy_tax_sek: 0.439                # Energy tax per kWh (fallback literal)
  energy_tax_entity: ""                # Optional HA entity overriding the literal (SEK or öre/kWh)
  fees_include_vat: false              # Import price = (spot + transfer + tax) × (1 + VAT).
                                       # false: the fees above are VAT-EXCLUSIVE (VAT applies to the
                                       #   whole sum) — the historical default.
                                       # true: the fees are VAT-INCLUSIVE (e.g. Swedish nätavgift /
                                       #   energiskatt helpers in öre "as billed") — VAT is applied to
                                       #   the spot only and the fees are added as-is, so you can point
                                       #   grid_transfer_fee_entity / energy_tax_entity straight at those
                                       #   helpers WITHOUT VAT being charged on them twice.
  # --- Export compensation (what you are PAID for exported energy) ---
  # Effective export price = (spot if export_includes_spot) + premium + grid_benefit - fee.
  # Set the literals to your contract, OR point *_entity at an HA sensor/input_number (SEK/kWh)
  # so the value follows the contract automatically (a configured entity overrides its literal).
  # All default to 0.0 -> export == spot (legacy). When the effective export price goes negative
  # the planner curtails/stores instead of exporting (see kepler.curtailment_penalty_sek).
  export_includes_spot: true           # Include the raw Nord Pool spot in the export price
  export_premium_sek_kwh: 0.0          # Elhandlarens påslag/ersättning (e.g. 0.10 = 10 öre/kWh)
  export_premium_entity: ""            # Optional HA entity (SEK/kWh) overriding the literal above
  export_grid_benefit_sek_kwh: 0.0     # Nätnytta (grid-benefit compensation), SEK/kWh
  export_grid_benefit_entity: ""       # Optional HA entity (SEK/kWh) overriding the literal above
  export_fee_sek_kwh: 0.0              # Per-kWh fee subtracted from the sale, SEK/kWh
  export_fee_entity: ""                # Optional HA entity (SEK/kWh) overriding the literal above

# Price Forecasting (Nordpool spot price prediction)
price_forecast:
  enabled: false                       # Master toggle for price forecasting (disabled by default)
  min_training_samples: 500            # Minimum paired samples before model activates
  model_name: "price_model.lgb"        # LightGBM model filename

# Forecasting Adjustments (Aurora ML tuning)
forecasting:
  active_forecast_version: "aurora"
  pv_residual_enabled: true            # true (default): hybrid PV = physics base + trained ML
                                       # residual. false: run PHYSICS-ONLY (physics * p10/p50/p90
                                       # bands) and skip the PV residual models entirely. Set false
                                       # as an interim after a physics correction (e.g. the DNI/DHI
                                       # transposition fix) until the PV residual models are retrained
                                       # on data computed with the new physics — otherwise the stale
                                       # residual double-corrects and over-forecasts.
  pv_confidence_percent: 83.0          # PV forecast scaling (100 = trust forecast fully)
  pv_p10_weight: 0.0                   # 0 = legacy scalar haircut above. >0 (e.g. 0.3-0.5):
                                       # blend each slot toward Aurora's own pessimistic p10
                                       # quantile instead — uncertain slots get discounted
                                       # hard, confident slots barely at all (Predbat-style
                                       # robustness). Slots lacking a p10 keep the scalar.
                                       # NOTE: with weight>0, pv_confidence_percent (and any
                                       # Reflex tuning of it) only affects p10-less slots.
  load_safety_margin_percent: 117.0    # HARD FLOOR on the S-Index load margin: the planner never
                                       # plans for less load than this % of the forecast, regardless
                                       # of s_index.risk_appetite (which tunes conservatism ABOVE it).

# Grid Limits & Effekttariff
# See system.grid.max_power_kw for the HARD limit (cannot be exceeded).
grid:
  # SOFT import cap: planner prefers to stay under import_limit_kw but can breach it
  # at a high penalty (5000 SEK/kWh). OPT-IN via enforce_import_limit — the limit has
  # shipped in configs for a long time without effect, so it only activates when you
  # explicitly say so.
  import_limit_kw: 11.0
  enforce_import_limit: false
  # Effekttariff (monthly peak demand charge). When cost > 0 the planner models your
  # DSO's demand tariff: a peak variable per calendar month dominates every clock-hour's
  # MEAN grid import (timmedelvärde — what Swedish DSOs bill) and the objective pays
  # cost_sek_per_kw for raising it above the month-to-date baseline. Staying under the
  # month's existing peak is free, and hours in a LATER month price their peak from
  # zero (billing resets). Mid-hour replans inject the current hour's already-elapsed
  # import (from the grid power sensor's history) so the billed full-hour mean is
  # priced correctly. Point baseline at a sensor holding this month's peak so far
  # (e.g. a utility_meter/statistics helper on hourly import power, monthly cycle);
  # the unit is read from unit_of_measurement (kW or W — set it on the helper).
  # 0/blank = feature off.
  peak_power_cost_sek_per_kw: 0.0      # your DSO's kr/kW/month demand charge (0 = off)
  peak_power_baseline_entity: ""       # HA sensor: month-to-date peak import (kW)
  peak_power_baseline_kw: 0.0          # fallback literal when the entity is unset/unreadable

# Kepler Solver (MILP optimizer settings)
kepler:
  ramping_cost_sek_per_kw: 0.01        # Penalty for power changes between slots (reduces sawtooth)
  # Near-zero so the planner CURTAILS (clips) surplus PV instead of exporting it whenever the
  # effective export price is negative — exporting at a negative price means paying to export.
  # Kept slightly >0 so the planner still prefers to *use/store* PV (charge battery, heat water,
  # serve load) over wasting it; those carry real value and always beat a tiny curtailment cost.
  # Raising this above |negative price| re-enables the old bug where shallow negative-price export
  # (cheaper than the penalty) was preferred over curtailing.
  curtailment_penalty_sek: 0.001       # SEK/kWh soft cost for clipping otherwise-unusable solar

# =============================================================================
# Home Assistant Integration
# =============================================================================

# Input Sensors (entities Darkstar READS from Home Assistant)
input_sensors:
  # Context sensors for ML features
  alarm_state: ""        # Alarm panel for occupancy detection (ML feature)
  vacation_mode: ""     # Vacation mode toggle (reduces load forecasts)

  # Core energy sensors (real-time power)
  battery_soc: ""           # Current battery state of charge (%)
  pv_power: ""             # Current PV production (W or kW)
  load_power: ""         # Current load consumption (W or kW)
  battery_power: ""   # Current battery power (+ discharge, - charge)
  grid_power: ""         # Current grid power (+ import, - export) (Used if meter_type=net)
  grid_import_power: ""    # Current grid import power (W/kW) (Used if meter_type=dual)
  grid_export_power: ""    # Current grid export power (W/kW) (Used if meter_type=dual)

  # Cumulative energy sensors (totals)
  total_battery_charge: ""      # Cumulative battery charge (kWh)
  total_battery_discharge: "" # Cumulative battery discharge (kWh)
  total_grid_export: ""          # Cumulative grid export (kWh)
  total_grid_import: ""          # Cumulative grid import (kWh)
  total_load_consumption: ""  # Cumulative load (kWh)
  total_pv_production: ""           # Cumulative PV production (kWh)

# Executor (control loop that WRITES to Home Assistant)
executor:
  enabled: true                                  # Enable executor control loop
  shadow_mode: true                              # Log actions but don't execute (for testing)
  interval_seconds: 60                           # How often to run (default: 1 minute)
  pause_reminder_minutes: 30                     # Notify if paused longer than this
  history_retention_days: 30                     # Keep execution history for N days

  # Price-conditioned grid-export curtailment (C3): when the EFFECTIVE export price
  # (pricing.export_* => spot + premium + grid_benefit - fee, i.e. what you are actually paid)
  # drops below the threshold, force the inverter export limit to 0 W so surplus PV is clipped
  # instead of exported at a loss; restore it above the threshold. Uses the inverter profile's
  # export_power_limit entity automatically (no entity config needed). Off by default.
  export_curtailment:
    enabled: false                # Master toggle
    threshold_sek_per_kwh: 0.0    # Curtail when effective export price < this (0 = when you'd pay)
    restore_limit_w: 0.0          # Watts to restore when not curtailing; 0 = auto-capture the
                                  # feed-in limit observed right before the first curtailment
  # HTTP Timeout: All Home Assistant API calls use a 5-second timeout with automatic
  # retry (3 attempts) for transient network failures. This prevents the executor from
  # freezing when HA becomes unresponsive (e.g., Fronius inverter via Modbus issues).

  # Toggle entities (read by executor to check if enabled)
  automation_toggle_entity: ""           # Master enable/disable switch
  manual_override_entity: ""    # Manual override active flag
  # Inverter Control Entities (executor WRITES to these)
  inverter:
    work_mode: ""                     # Inverter mode selector
    soc_target: ""                 # Target maintenance level. Acts as a discharge floor (won't discharge below this %) AND a grid charge target (won't charge above this % from grid). Required for inverters like Deye (behavior for other inverters unknown).
    work_mode_export: "Export First"                                # Value for export mode
    work_mode_zero_export: "Zero Export To CT"                      # Value for zero-export mode
    grid_charging_enable: ""     # Enable/disable grid charging
    max_charge_current: ""     # Max charge current (A)
    max_discharge_current: ""  # Max discharge current (A)
    grid_max_export_power: ""           # Max grid export power (Watts)
    grid_max_export_power_switch: ""    # Switch entity to enable/disable grid export limit

    # Control Unit Configuration (REV E3)
    control_unit: "A"                                                 # "A" (Amperes) or "W" (Watts)
    max_charge_power: ""                                       # Entity for max charge power (W)
    max_discharge_power: ""                                    # Entity for max discharge power (W)

    # Profile-specific composite entities (e.g., Sungrow ems_mode, forced_charge_discharge_cmd)
    custom_entities: {}

  # Controller Parameters (electrical conversion constants)
  controller:
    min_charge_a: 10.0                 # Minimum meaningful charge current (A)
    round_step_a: 5.0                  # Round current commands to nearest X amps
    write_threshold_a: 5.0             # Only write if change exceeds X amps

    # Watt-based Control Limits (used if control_unit="W")
    min_charge_w: 500.0                # Minimum meaningful charge power (W)
    round_step_w: 100.0                # Round power commands to nearest X watts
    write_threshold_w: 100.0           # Only write power if change exceeds X watts (EEPROM protection)

  # Water Heater Control
  # The executor controls your water heater by setting a target temperature.
  # These temps define the operating modes:
  water_heater:
    temp_off: 40       # Idle mode (legionella-safe minimum)
    temp_normal: 60    # Scheduled heating target (used by planner)
    temp_boost: 70     # Manual boost button (Dashboard/Executor)
    temp_max: 85       # PV dump target + safety limit (never exceeded)
    manual_on_respect_minutes: 90   # Switch-type targets only: a HUMAN turning the
                                    # relay on while the plan wants it off is honored
                                    # as an implicit boost for this many minutes
                                    # (the wall switch becomes an honest boost button).
                                    # 0 = plan always wins. States the executor set
                                    # itself are always enforced normally.

  # Notifications (via Home Assistant notify service)
  notifications:
    service: ""  # HA notify service to use
    on_charge_start: true              # Notify when grid charging starts
    on_charge_stop: false              # Notify when grid charging stops
    on_export_start: true              # Notify when export/discharge starts
    on_export_stop: true               # Notify when export/discharge stops
    on_water_heat_start: true          # Notify when water heating starts
    on_water_heat_stop: false          # Notify when water heating stops
    on_ev_charge_start: true           # Notify when EV charging starts
    on_ev_charge_stop: false           # Notify when EV charging stops
    on_soc_target_change: false        # Notify when SoC target changes
    on_override_activated: true        # Notify when manual override triggers
    on_error: true                     # Notify on executor errors

  # Override Configuration (real-time safety triggers)
  # These settings control when the executor overrides the planned schedule
  # to protect the battery or utilize excess energy.
  override: {}

  # Excess PV Dispatch
  # Configures how forecast excess PV energy is utilized.
  # The planner proactively schedules excess PV into the chosen sink.
  excess_pv:
    sink: disabled                     # Sink type: water_heater_boost | custom_entity | disabled
    boost_reward_sek_per_kwh: 0.5      # Reward for using excess PV at sink vs exporting (SEK/kWh)
    soc_threshold_percent: 95          # Battery SoC % required before sink activates (default 95)
    custom_entity:
      # Set enabled: true to run this sink ALONGSIDE the primary `sink` above (e.g. keep
      # sink: water_heater_boost for the main VVB AND cool the villavagn AC on surplus).
      # Leaving sink: custom_entity also activates it (legacy). Default false.
      enabled: false
      entity: ""                       # Home Assistant entity ID (e.g., switch.pool_pump or climate.villavagn)
      on_value: "1"                    # Value to set when excess PV is available (plain entities)
      off_value: "0"                   # Value to set when excess PV is not available (plain entities)
      power_kw: 1.0                    # Estimated power consumption (kW) — used by solver for reward sizing
      # Optional export-price ceiling (SEK/kWh). When set, the sink only activates in
      # slots whose export price is at or below this value — i.e. soak surplus locally
      # only when grid export pays little or nothing (incl. negative prices). Leave
      # blank for "any surplus" (legacy). For the villavagn-AC summer cooling sink set
      # e.g. 0.20 so cooling runs only on low/minus-price surplus hours.
      price_ceiling_sek_per_kwh: ""
      # Climate-entity fields (used ONLY when `entity` is a climate.* unit, e.g. the
      # villavagn AC). For switches/numbers they are ignored.
      climate_mode: "cool"             # hvac_mode to set when the sink turns ON
      target_temp: ""                  # cooling setpoint applied when ON (blank = leave unit's own)
      comfort_min_temp: ""             # don't cool below this current_temperature (anti-overcool floor)
    # Prioritized excess-PV sink ladder (ordered list; index = priority rung after
    # the water-heater boost). When non-empty this list REPLACES the single
    # custom_entity block above (which stays supported as a legacy fallback — an
    # existing config keeps working unchanged). Each rung activates only on
    # forecast excess-PV slots, only above soc_threshold_percent, and (when its
    # ceiling is set) only in slots whose export price is at or below
    # price_ceiling_sek_per_kwh. When surplus is scarce the planner fills earlier
    # rungs first (soft economic priority, no hard chaining); when surplus covers
    # everything, all enabled rungs run. Per-rung fields match the custom_entity
    # block plus a unique `id`. enabled: false = observe-first — the planner
    # ignores the rung and the executor never actuates it; flip per rung when ready.
    sinks: []
    # Example:
    # sinks:
    #   - id: villavagn_ac
    #     entity: climate.villavagn
    #     enabled: false
    #     power_kw: 1.0
    #     price_ceiling_sek_per_kwh: 0.20
    #     climate_mode: cool
    #     target_temp: 22
    #     comfort_min_temp: 20
    #   - id: poolpump
    #     entity: switch.poolpump
    #     enabled: false
    #     power_kw: 0.25
    #     price_ceiling_sek_per_kwh: 0.20

  # ---------------------------------------------------------------------------
  # Real-time EV surplus-follow controller (default OFF). Dials each charger's
  # current so EV charging tracks an energy budget instead of draining the home
  # battery. 3-tier source policy: solar surplus -> cheap/negative grid -> home
  # battery (only when price negative AND lots of solar still forecast). Manual
  # per-charger override via an input_select (auto/force_on/force_off).
  # NOTE: Easee current is set via the FLASH-SAFE `set_charger_dynamic_limit`
  # service (volatile/RAM). Darkstar NEVER writes the non-dynamic max/circuit
  # limits, which would wear the charger's flash.
  ev_surplus:
    enabled: false
    pv_power_entity: ""                 # solar production (W), e.g. sensor.total_pv_power
    grid_power_entity: ""               # signed grid power (+import), e.g. sensor.meter_active_power
    battery_power_entity: ""            # signed battery power (+charge), e.g. sensor.battery_charging_power_signed
    battery_soc_entity: ""              # home battery SoC %, e.g. sensor.battery_level
    price_entity: ""                    # spot price SEK/kWh, e.g. sensor.spot_price_sek_kwh
    remaining_solar_entity: ""          # optional kWh still forecast today; blank => battery-assist tier inert
    vacation_entity: ""                 # input_boolean.vacation_mode; flips per-charger vacation_target_soc
    policy:
      cheap_grid_price_sek: 0.30        # allow grid for EV when spot <= this (blank/absent => solar only)
      cheap_grid_allowance_w: 3680      # max grid import to give the cars when cheap
      gain: 0.5                         # control damping (0-1)
      deadband_w: 250                   # hold within this power error (anti-jitter)
      current_step_a: 2.0               # snap commanded amps to this grid (chunky steps)
      start_hysteresis: 0.15            # extra headroom (frac of min) an OFF charger needs to start
      battery_assist:
        enabled: false
        max_price_sek: 0.0              # battery only helps when spot <= this (0 = negative)
        min_remaining_solar_kwh: 8.0    # ...and this much PV still forecast today
        floor_soc: 40.0                 # never pull the home battery below this for cars
        allowance_w: 6000               # cap on battery -> car
    write_guard:
      min_step_a: 2.0                   # only rewrite current when target moves >= this many A
      min_interval_s: 90                # ...and at least this long since the last write (a STOP bypasses it)
    chargers: []
      # Departure / target-SoC awareness (all optional, per charger):
      #   soc_entity         current SoC read (FMB: input_number.fmb_soc; Tesla: sensor.*_battery_level)
      #   target_soc_entity  user-settable target % (input_number). soc >= target => stop (cap, never overcharge)
      #   departure_entity   input_datetime (date+time). Behind the curve to hit target by then => grid-backed
      #                      floor that ramps to charger max as the deadline nears; a deadline car overtakes the
      #                      others. No departure => the car only charges from opportunistic surplus toward target.
      #   capacity_kwh       usable battery (sizes the deadline floor)
      #   vacation_target_soc when vacation_entity is on, the target switches to this (e.g. FMB 15 = cap at 15%,
      #                      solar-only since the FMB has no departure deadline). Omit => vacation leaves it alone.
      # - id: easee                     # priority #1 (lower = filled first)
      #   priority: 0
      #   min_current_a: 6
      #   max_current_a: 16
      #   phases: 1                     # FMB charges 1-phase
      #   switch_entity: switch.easee_niska_it_charger_enabled
      #   easee_device_id: ""           # HA device id of the Easee (for set_charger_dynamic_limit)
      #   power_entity: sensor.easee_niska_it_power
      #   plug_entity: binary_sensor.easee_ev_plugged_in
      #   override_entity: input_select.darkstar_ev_easee_mode
      #   soc_entity: input_number.fmb_soc        # dead-reckoned FMB SoC (from fmb_soc_estimator)
      #   capacity_kwh: 28
      #   vacation_target_soc: 15                 # vacation: cap FMB at 15%, solar-only (no departure)
      # - id: tesla                     # priority #2
      #   priority: 1
      #   min_current_a: 5
      #   max_current_a: 16
      #   phases: 3
      #   switch_entity: switch.white_betty_charge
      #   current_entity: number.white_betty_charge_current   # number.set_value path
      #   power_entity: sensor.white_betty_charger_power
      #   plug_entity: binary_sensor.white_betty_charge_cable
      #   home_entity: device_tracker.white_betty_location
      #   override_entity: input_select.darkstar_ev_tesla_mode
      #   soc_entity: sensor.white_betty_battery_level
      #   target_soc_entity: input_number.darkstar_tesla_target_soc
      #   departure_entity: input_datetime.darkstar_tesla_departure
      #   capacity_kwh: 60

  # FMB SoC estimator (default OFF). The FMB reports no real SoC, so we dead-reckon it:
  # integrate delivered energy UP while charging (Easee lifetime-energy counter), drift it
  # DOWN at a learned consumption rate while idle, and self-calibrate that rate from how much
  # energy each full-to-full cycle takes. Publishes sensor.darkstar_fmb_soc_estimate — point
  # the planner's FMB soc_sensor at it (and clear that charger's switch_entity so the planner
  # stop-when-full no longer fights the surplus controller for the Easee enable switch).
  fmb_soc_estimator:
    enabled: false
    capacity_kwh: 28                       # FMB battery
    charge_efficiency: 0.9                 # grid -> battery loss
    prior_consumption_kwh_per_day: 5.6     # start guess (~20%/day of 28 kWh); learned from cycles
    learn_alpha: 0.3                       # EMA weight on each full-to-full observation
    initial_soc: 50                        # conservative seed when no persisted state exists
    # seed_soc: 40                         # one-shot manual correction: set to snap the estimate to
                                           # this %% (e.g. from the car's range readout), then it
                                           # dead-reckons from there. Change the value to re-apply;
                                           # config-only, no rebuild needed.
    full_idle_min_s: 300                   # taper-at-offered-current this long => car is full
    lifetime_energy_entity: ""             # e.g. sensor.easee_niska_it_lifetime_energy
    power_entity: ""                       # e.g. sensor.easee_niska_it_power
    plug_entity: ""                        # e.g. binary_sensor.easee_ev_plugged_in
    enabled_switch_entity: ""              # e.g. switch.easee_niska_it_charger_enabled
    dynamic_limit_entity: ""               # e.g. sensor.easee_niska_it_dynamic_charger_limit
    status_entity: ""                      # e.g. sensor.easee_niska_it_status
    correction_entity: ""                  # OPTIONAL user-editable input_number to correct the
                                           # estimate (snap-on-change). MUST be a SEPARATE helper from
                                           # writeback_entity — never the same one, or the estimator
                                           # reads its own writes back as corrections (auto-disabled if
                                           # equal). For config-driven correction, prefer seed_soc.
    writeback_entity: ""                   # OPTIONAL: write the SoC into this input_number so the
                                           # operator's own FMB template sensors/dashboard read it
                                           # (e.g. input_number.fmb_soc). Darkstar becomes the SOLE
                                           # writer — disable any old automation driving it FIRST.
    publish_entity_id: sensor.darkstar_fmb_soc_estimate  # set "" to skip the Darkstar SoC sensor
    publish_rate_entity_id: sensor.darkstar_fmb_consumption_rate

  # Deferrable smart-appliance controller (dishwasher / washing machine). Turnkey: each
  # entry in the top-level `deferrable_loads:` that has a `power_sensor` is auto-armed when
  # its cycle starts, scheduled into the cheapest FORECAST window for the whole cycle before
  # its deadline (duration-aware), and detected as done. Publishes sensor.<prefix><id>_state
  # (idle/armed/waiting/running) with a `recommended_action` + `recommended_start` attribute.
  # Default OFF. OBSERVE-ONLY by default: it publishes state + notifies but does NOT gate the
  # plug, so you can verify its decisions against your existing HA automations before cutover.
  deferrable_appliances:
    enabled: false
    observe_only: true             # true = publish + notify only (no plug actuation). Verify first.
    notify_service: ""             # e.g. notify.notify_robert_emilia; blank => no notifications
    publish_prefix: "darkstar_"    # sensor.<prefix><id>_state
    slot_minutes: 15               # planner slot length (for duration -> slot count)

# =============================================================================
# UI Settings
# =============================================================================

# Dashboard Settings
dashboard:
  auto_refresh_enabled: true           # Auto-refresh dashboard schedule display

# Theme Settings
ui:
  theme: "Material Design Colors"      # Color theme name
  theme_accent_index: 3                # Accent color index (0-based)
